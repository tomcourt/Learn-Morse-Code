<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Reference</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 10px;
            padding: 0;
            background-color: #f8f9fa;
            color: #212529;
        }
        .morse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            padding: 10px;
        }
        .morse-item {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .char {
            font-weight: 700;
            font-size: 1.1rem;
            color: #495057;
        }
        .sequence {
            font-family: Consolas, monospace;
            font-size: 1.2rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        .dit {
            display: inline-block;
            transform: scaleX(0.65); /* Narrow middle dot */
            color: #212529;
        }
        .dah {
            display: inline-block;
            transform: scaleX(1.4); /* Wide dash */
            color: #1a73e8;
            margin-left: 1px;
            margin-right: 1px;
        }
    </style>
</head>
<body>

<div class="morse-grid">
    <!-- Letters -->
    <div class="morse-item"><span class="char">A</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">B</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">C</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">D</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">E</span><span class="sequence"><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">F</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">G</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">H</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">I</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">J</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">K</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">L</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">M</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">N</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">O</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">P</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">Q</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">R</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">S</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">T</span><span class="sequence"><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">U</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">V</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">W</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">X</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">Y</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">Z</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span></span></div>

    <!-- Numbers -->
    <div class="morse-item"><span class="char">1</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">2</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">3</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">4</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">5</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">6</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">7</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">8</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">9</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">0</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>

    <!-- Punctuation -->
    <div class="morse-item"><span class="char">,</span><span class="sequence"><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">.</span><span class="sequence"><span class="dit">¥</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dah">Ñ</span></span></div>
    <div class="morse-item"><span class="char">/</span><span class="sequence"><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dit">¥</span></span></div>
    <div class="morse-item"><span class="char">?</span><span class="sequence"><span class="dit">¥</span><span class="dit">¥</span><span class="dah">Ñ</span><span class="dah">Ñ</span><span class="dit">¥</span><span class="dit">¥</span></span></div>
</div>

</body>
</html>
